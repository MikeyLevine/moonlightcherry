services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonlightcherry
      # Dev default kept as a fallback so local setup needs no extra config.
      # Production MUST set a real POSTGRES_PASSWORD in .env — and it must
      # match the password embedded in DATABASE_URL, since docker-compose and
      # Prisma read these independently; nothing keeps them in sync but you.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moonlightcherry_dev}
      POSTGRES_DB: moonlightcherry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
