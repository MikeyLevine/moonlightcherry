services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonlightcherry
      POSTGRES_PASSWORD: moonlightcherry_dev
      POSTGRES_DB: moonlightcherry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
