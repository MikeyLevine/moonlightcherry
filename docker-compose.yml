services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonlightcherry
      # Only applied the first time this container initializes an empty data
      # volume — changing it later has no effect on an already-running
      # instance (Postgres passwords belong to the role, not this env var).
      # Production doesn't touch this at all: it uses its own separately
      # created Postgres role (moonlightcherry_prod) inside this same
      # instance, provisioned once via `CREATE ROLE ... WITH LOGIN PASSWORD`
      # (see deploy/README.md) — proper credential separation from dev's
      # role, not just a different database under the same login.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moonlightcherry_dev}
      POSTGRES_DB: moonlightcherry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
